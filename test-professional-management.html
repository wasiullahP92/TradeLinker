<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TradeLinker Professional Management Verification Suite</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 24px; background: #0F172A; color: #F8FAFC; margin: 0; }
    h1 { color: #01AD8F; margin-top: 0; font-size: 1.5rem; }
    .summary-bar { padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; font-weight: 700; font-size: 1.1rem; }
    .summary-pass { background: #064E3B; color: #34D399; border: 1px solid #059669; }
    .summary-fail { background: #7F1D1D; color: #F87171; border: 1px solid #DC2626; }
    .test-box { background: #1E293B; border-radius: 6px; padding: 12px 16px; margin-bottom: 8px; border-left: 4px solid #64748B; font-size: 0.9rem; }
    .test-box.pass { border-left-color: #10B981; }
    .test-box.fail { border-left-color: #EF4444; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-weight: 700; font-size: 11px; margin-right: 8px; }
    .badge.pass { background: #064E3B; color: #34D399; }
    .badge.fail { background: #7F1D1D; color: #F87171; }
    .details { font-size: 0.8rem; color: #94A3B8; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>TradeLinker Professional Management & KYC Verification Suite</h1>
  <div id="resultsUI">Running automated test assertions...</div>

  <!-- Direct In-DOM Container with Professional UI Elements -->
  <div id="testDomWrapper" style="display:none;">
    <div id="proStatTotal">0</div>
    <div id="proStatVerified">0</div>
    <div id="proStatPending">0</div>
    <div id="proStatPremium">0</div>
    <div id="proStatSuspended">0</div>
    <div id="badgeNavProfessionals">0</div>

    <input type="text" id="professionalSearchInput">
    <select id="professionalVerifFilter">
      <option value="all">All Verification</option>
      <option value="verified">Verified Only</option>
      <option value="pending">Pending KYC</option>
      <option value="rejected">Rejected</option>
    </select>
    <select id="professionalCategoryFilter">
      <option value="all">All Trade Sectors</option>
      <option value="electrical">Electrical</option>
      <option value="plumbing">Plumbing</option>
      <option value="solar">Solar Energy</option>
      <option value="carpentry">Carpentry &amp; Doors</option>
      <option value="hvac">AC &amp; HVAC</option>
      <option value="construction">Construction</option>
    </select>
    <select id="professionalStatusFilter">
      <option value="all">All Statuses</option>
      <option value="active">Active Only</option>
      <option value="suspended">Suspended Only</option>
    </select>
    <select id="professionalSortSelect">
      <option value="rating_desc">Highest Rated</option>
      <option value="experience_desc">Most Experienced</option>
      <option value="verif_status">KYC Status</option>
      <option value="name_asc">Name</option>
      <option value="newest">Newest</option>
    </select>
    <select id="professionalPerPageSelect">
      <option value="5" selected>5</option>
      <option value="10">10</option>
      <option value="20">20</option>
    </select>

    <table>
      <tbody id="professionalsManagementTbody"></tbody>
    </table>

    <div id="proPaginationInfo"></div>
    <div id="proPaginationControls"></div>

    <!-- Modals -->
    <div id="professionalDossierModal" class="tl-modal-backdrop">
      <img id="dossierAvatar" src="">
      <div id="dossierBusinessName"></div>
      <div id="dossierFullName"></div>
      <div id="dossierCategory"></div>
      <div id="dossierExperience"></div>
      <div id="dossierCity"></div>
      <div id="dossierKycBadge"></div>
      <div id="dossierStatusBadge"></div>
      <div id="dossierPremiumBadge"></div>

      <button id="tabBtnOverview"></button>
      <button id="tabBtnServices"></button>
      <button id="tabBtnPortfolio"></button>
      <button id="tabBtnBookings"></button>

      <div id="tabPaneOverview">
        <div id="dossierBio"></div>
        <div id="dossierSkills"></div>
        <div id="dossierServiceAreas"></div>
        <div id="dossierProviderId"></div>
        <div id="dossierUserId"></div>
        <div id="dossierEmail"></div>
        <div id="dossierPhone"></div>
        <div id="dossierCityDetail"></div>
        <div id="dossierRegisteredAt"></div>
        <div id="dossierRatingRow"></div>
      </div>

      <div id="tabPaneServices">
        <span id="dossierServicesCount">0</span>
        <div id="dossierServicesContainer"></div>
      </div>

      <div id="tabPanePortfolio">
        <span id="dossierPortfolioCount">0</span>
        <div id="dossierPortfolioContainer"></div>
      </div>

      <div id="tabPaneBookings">
        <span id="dossierBookingsCount">0</span>
        <div id="dossierBookingsContainer"></div>
      </div>

      <button id="dossierSuspendActionBtn"></button>
    </div>

    <div id="professionalEditModal" class="tl-modal-backdrop">
      <div id="modalProEditError" style="display:none;"></div>
      <form id="professionalEditForm">
        <input type="hidden" id="modalProEditId">
        <input type="text" id="modalProEditBusinessName">
        <select id="modalProEditCategory">
          <option value="electrical">Electrical Services</option>
          <option value="plumbing">Plumbing Services</option>
          <option value="solar">Solar Energy Services</option>
          <option value="carpentry">Wooden Door Making &amp; Carpentry</option>
          <option value="hvac">AC &amp; HVAC Services</option>
          <option value="construction">Construction Services</option>
        </select>
        <input type="number" id="modalProEditExperience">
        <select id="modalProEditCity">
          <option value="Islamabad">Islamabad</option>
          <option value="Rawalpindi">Rawalpindi</option>
          <option value="Lahore">Lahore</option>
        </select>
        <input type="text" id="modalProEditServiceAreas">
        <input type="text" id="modalProEditSkills">
        <textarea id="modalProEditBio"></textarea>
        <select id="modalProEditVerification">
          <option value="verified">Verified</option>
          <option value="pending">Pending</option>
          <option value="rejected">Rejected</option>
        </select>
        <select id="modalProEditPremium">
          <option value="false">false</option>
          <option value="true">true</option>
        </select>
        <input type="url" id="modalProEditAvatar">
      </form>
    </div>

    <div id="professionalKYCModal" class="tl-modal-backdrop">
      <div id="modalKYCError" style="display:none;"></div>
      <input type="hidden" id="modalKYCProId">
      <img id="modalKYCAvatar" src="">
      <div id="modalKYCBusinessName"></div>
      <div id="modalKYCSubTitle"></div>
      <div id="modalKYCCurrentBadge"></div>
      <select id="modalKYCDecision">
        <option value="verified">verified</option>
        <option value="pending">pending</option>
        <option value="rejected">rejected</option>
      </select>
      <textarea id="modalKYCReasonNote"></textarea>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/services.js"></script>
  <script src="js/bookings.js"></script>
  <script src="js/communication.js"></script>

  <script>
    let currentAdminUser = { id: "usr-admin-001", fullName: "System Administrator", role: "admin" };

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const professionalState = {
      currentPage: 1,
      perPage: 5,
      search: '',
      verifFilter: 'all',
      categoryFilter: 'all',
      statusFilter: 'all',
      sortBy: 'rating_desc',
      selectedProId: null,
      activeTab: 'overview'
    };

    function onProSearchChange(val) {
      professionalState.search = (val || '').toLowerCase().trim();
      professionalState.currentPage = 1;
      renderProfessionalsTable();
    }

    function onProVerifFilterChange() {
      professionalState.verifFilter = document.getElementById('professionalVerifFilter')?.value || 'all';
      professionalState.currentPage = 1;
      renderProfessionalsTable();
    }

    function onProCategoryFilterChange() {
      professionalState.categoryFilter = document.getElementById('professionalCategoryFilter')?.value || 'all';
      professionalState.currentPage = 1;
      renderProfessionalsTable();
    }

    function onProStatusFilterChange() {
      professionalState.statusFilter = document.getElementById('professionalStatusFilter')?.value || 'all';
      professionalState.currentPage = 1;
      renderProfessionalsTable();
    }

    function onProSortChange(val) {
      professionalState.sortBy = val || 'rating_desc';
      renderProfessionalsTable();
    }

    function onProPerPageChange(val) {
      professionalState.perPage = parseInt(val, 10) || 5;
      professionalState.currentPage = 1;
      renderProfessionalsTable();
    }

    function resetProFilters() {
      professionalState.currentPage = 1;
      professionalState.search = '';
      professionalState.verifFilter = 'all';
      professionalState.categoryFilter = 'all';
      professionalState.statusFilter = 'all';
      professionalState.sortBy = 'rating_desc';

      const sInput = document.getElementById('professionalSearchInput');
      if (sInput) sInput.value = '';
      const vFilter = document.getElementById('professionalVerifFilter');
      if (vFilter) vFilter.value = 'all';
      const cFilter = document.getElementById('professionalCategoryFilter');
      if (cFilter) cFilter.value = 'all';
      const stFilter = document.getElementById('professionalStatusFilter');
      if (stFilter) stFilter.value = 'all';
      const sSelect = document.getElementById('professionalSortSelect');
      if (sSelect) sSelect.value = 'rating_desc';
      const ppSelect = document.getElementById('professionalPerPageSelect');
      if (ppSelect) ppSelect.value = '5';
      professionalState.perPage = 5;

      renderProfessionalsTable();
    }

    function changeProPage(page) {
      professionalState.currentPage = page;
      renderProfessionalsTable();
    }

    function renderProfessionalsTable() {
      const allPros = (typeof TLAuth !== 'undefined' && TLAuth.getAllProfessionalsJoined) 
        ? TLAuth.getAllProfessionalsJoined() 
        : [];

      const totalCount = allPros.length;
      const verifiedCount = allPros.filter(p => p.verificationStatus === 'verified').length;
      const pendingCount = allPros.filter(p => p.verificationStatus === 'pending').length;
      const premiumCount = allPros.filter(p => p.isPremium).length;
      const suspendedCount = allPros.filter(p => p.userStatus === 'suspended').length;

      const elTotal = document.getElementById('proStatTotal');
      if (elTotal) elTotal.innerText = totalCount;
      const elVerif = document.getElementById('proStatVerified');
      if (elVerif) elVerif.innerText = verifiedCount;
      const elPend = document.getElementById('proStatPending');
      if (elPend) elPend.innerText = pendingCount;
      const elPrem = document.getElementById('proStatPremium');
      if (elPrem) elPrem.innerText = premiumCount;
      const elSusp = document.getElementById('proStatSuspended');
      if (elSusp) elSusp.innerText = suspendedCount;

      const badgeNav = document.getElementById('badgeNavProfessionals');
      if (badgeNav) badgeNav.innerText = totalCount;

      let list = allPros.filter(p => {
        if (professionalState.search) {
          const q = professionalState.search;
          const matchName = (p.fullName || '').toLowerCase().includes(q);
          const matchBiz = (p.businessName || '').toLowerCase().includes(q);
          const matchCat = (p.categoryTitle || p.categoryId || '').toLowerCase().includes(q);
          const matchSkills = Array.isArray(p.skills) && p.skills.some(s => (s || '').toLowerCase().includes(q));
          const matchCity = (p.city || '').toLowerCase().includes(q);
          const matchAreas = Array.isArray(p.serviceAreas) && p.serviceAreas.some(a => (a || '').toLowerCase().includes(q));
          if (!matchName && !matchBiz && !matchCat && !matchSkills && !matchCity && !matchAreas) return false;
        }

        if (professionalState.verifFilter !== 'all') {
          if (p.verificationStatus !== professionalState.verifFilter) return false;
        }

        if (professionalState.categoryFilter !== 'all') {
          const cF = professionalState.categoryFilter.toLowerCase();
          const pCatId = (p.categoryId || '').toLowerCase();
          const pCatTitle = (p.categoryTitle || '').toLowerCase();
          if (pCatId !== cF && !pCatTitle.includes(cF)) return false;
        }

        if (professionalState.statusFilter !== 'all') {
          if (p.userStatus !== professionalState.statusFilter) return false;
        }

        return true;
      });

      list.sort((a, b) => {
        if (professionalState.sortBy === 'rating_desc') {
          return ((b.rating || 0) - (a.rating || 0)) || ((b.reviewCount || 0) - (a.reviewCount || 0));
        }
        if (professionalState.sortBy === 'experience_desc') {
          return (b.experienceYears || 0) - (a.experienceYears || 0);
        }
        if (professionalState.sortBy === 'verif_status') {
          const rank = { verified: 1, pending: 2, rejected: 3 };
          return (rank[a.verificationStatus] || 9) - (rank[b.verificationStatus] || 9);
        }
        if (professionalState.sortBy === 'name_asc') {
          return (a.businessName || a.fullName || '').localeCompare(b.businessName || b.fullName || '');
        }
        if (professionalState.sortBy === 'newest') {
          return new Date(b.registeredAt || 0) - new Date(a.registeredAt || 0);
        }
        return 0;
      });

      const totalFiltered = list.length;
      const totalPages = Math.ceil(totalFiltered / professionalState.perPage) || 1;
      if (professionalState.currentPage > totalPages) professionalState.currentPage = totalPages;
      if (professionalState.currentPage < 1) professionalState.currentPage = 1;

      const startIndex = (professionalState.currentPage - 1) * professionalState.perPage;
      const paginatedItems = list.slice(startIndex, startIndex + professionalState.perPage);

      const tbody = document.getElementById('professionalsManagementTbody');
      if (tbody) {
        if (paginatedItems.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9">No service professionals found</td></tr>`;
        } else {
          tbody.innerHTML = paginatedItems.map(p => `
            <tr data-pro-id="${p.id}">
              <td class="col-name">${escapeHtml(p.fullName)}</td>
              <td class="col-biz">${escapeHtml(p.businessName || '')}</td>
              <td class="col-cat">${escapeHtml(p.categoryTitle || p.categoryId)}</td>
              <td class="col-city">${escapeHtml(p.city || '')}</td>
              <td class="col-exp">${p.experienceYears || 1} yrs</td>
              <td class="col-verif">${p.verificationStatus}</td>
              <td class="col-rating">${p.rating}</td>
              <td class="col-status">${p.userStatus}</td>
              <td class="col-actions">
                <button onclick="openProfessionalDossierModal('${p.id}')">Dossier</button>
                <button onclick="openKYCReviewModal('${p.id}')">KYC</button>
                <button onclick="openEditProfessionalModal('${p.id}')">Edit</button>
                <button onclick="toggleProfessionalSuspension('${p.id}')">Toggle</button>
              </td>
            </tr>
          `).join('');
        }
      }

      const pInfo = document.getElementById('proPaginationInfo');
      if (pInfo) {
        if (totalFiltered === 0) {
          pInfo.innerText = "Showing 0 professionals";
        } else {
          const end = Math.min(startIndex + professionalState.perPage, totalFiltered);
          pInfo.innerText = `Showing ${startIndex + 1} to ${end} of ${totalFiltered} professionals`;
        }
      }

      const pControls = document.getElementById('proPaginationControls');
      if (pControls) {
        if (totalPages <= 1) {
          pControls.innerHTML = '';
        } else {
          let btns = [];
          for (let i = 1; i <= totalPages; i++) {
            btns.push(`<button class="${i === professionalState.currentPage ? 'active' : ''}">${i}</button>`);
          }
          pControls.innerHTML = btns.join('');
        }
      }
    }

    function openProfessionalDossierModal(proId) {
      professionalState.selectedProId = proId;
      const dossier = TLAuth.getProfessionalFullDossier(proId);
      if (!dossier) return;

      const { professional: p, services, bookings, portfolio } = dossier;

      document.getElementById('dossierAvatar').src = p.avatar;
      document.getElementById('dossierBusinessName').innerText = p.businessName;
      document.getElementById('dossierFullName').innerText = p.fullName;
      document.getElementById('dossierCategory').innerText = p.categoryTitle;
      document.getElementById('dossierExperience').innerText = `${p.experienceYears} yrs experience`;
      document.getElementById('dossierCity').innerText = p.city;
      document.getElementById('dossierKycBadge').innerText = p.verificationStatus;
      document.getElementById('dossierStatusBadge').innerText = p.userStatus;
      document.getElementById('dossierBio').innerText = p.bioDescription;
      document.getElementById('dossierProviderId').innerText = p.id;
      document.getElementById('dossierUserId').innerText = p.userId;
      document.getElementById('dossierEmail').innerText = p.email;
      document.getElementById('dossierPhone').innerText = p.phone;

      document.getElementById('dossierServicesCount').innerText = services.length;
      document.getElementById('dossierPortfolioCount').innerText = portfolio.length;
      document.getElementById('dossierBookingsCount').innerText = bookings.length;

      document.getElementById('professionalDossierModal').classList.add('active');
    }

    function closeProfessionalDossierModal() {
      document.getElementById('professionalDossierModal').classList.remove('active');
    }

    function openEditProfessionalModal(proId) {
      professionalState.selectedProId = proId;
      const pros = TLAuth.getAllProfessionalsJoined();
      const p = pros.find(x => x.id === proId || x.userId === proId);
      if (!p) return;

      document.getElementById('modalProEditId').value = p.id;
      document.getElementById('modalProEditBusinessName').value = p.businessName || '';
      document.getElementById('modalProEditCategory').value = p.categoryId || 'electrical';
      document.getElementById('modalProEditExperience').value = p.experienceYears || 1;
      document.getElementById('modalProEditCity').value = p.city || 'Islamabad';
      document.getElementById('modalProEditServiceAreas').value = (p.serviceAreas || []).join(', ');
      document.getElementById('modalProEditSkills').value = (p.skills || []).join(', ');
      document.getElementById('modalProEditBio').value = p.bioDescription || '';
      document.getElementById('modalProEditVerification').value = p.verificationStatus || 'pending';
      document.getElementById('modalProEditPremium').value = p.isPremium ? 'true' : 'false';

      document.getElementById('professionalEditModal').classList.add('active');
    }

    function closeEditProfessionalModal() {
      document.getElementById('professionalEditModal').classList.remove('active');
    }

    function handleProEditSubmit(event) {
      if (event) event.preventDefault();
      const proId = document.getElementById('modalProEditId').value;
      const businessName = document.getElementById('modalProEditBusinessName').value.trim();
      const categoryId = document.getElementById('modalProEditCategory').value;
      const experienceYears = parseInt(document.getElementById('modalProEditExperience').value, 10) || 1;
      const city = document.getElementById('modalProEditCity').value;
      const serviceAreas = document.getElementById('modalProEditServiceAreas').value;
      const skills = document.getElementById('modalProEditSkills').value;
      const bioDescription = document.getElementById('modalProEditBio').value.trim();
      const verificationStatus = document.getElementById('modalProEditVerification').value;
      const isPremium = document.getElementById('modalProEditPremium').value === 'true';

      const res = TLAuth.updateProfessionalByAdmin(proId, {
        businessName,
        categoryId,
        experienceYears,
        city,
        serviceAreas,
        skills,
        bioDescription,
        verificationStatus,
        isPremium
      }, "usr-admin-001");

      closeEditProfessionalModal();
      renderProfessionalsTable();
      return res;
    }

    function openKYCReviewModal(proId) {
      professionalState.selectedProId = proId;
      const pros = TLAuth.getAllProfessionalsJoined();
      const p = pros.find(x => x.id === proId || x.userId === proId);
      if (!p) return;

      document.getElementById('modalKYCProId').value = p.id;
      document.getElementById('modalKYCBusinessName').innerText = p.businessName;
      document.getElementById('modalKYCDecision').value = p.verificationStatus || 'verified';
      document.getElementById('professionalKYCModal').classList.add('active');
    }

    function closeKYCReviewModal() {
      document.getElementById('professionalKYCModal').classList.remove('active');
    }

    function handleKYCReviewSubmit() {
      const proId = document.getElementById('modalKYCProId').value;
      const decision = document.getElementById('modalKYCDecision').value;
      const reasonNote = document.getElementById('modalKYCReasonNote').value || "Audit note";

      const res = TLAuth.reviewProfessionalVerification(proId, decision, reasonNote, "usr-admin-001");
      closeKYCReviewModal();
      renderProfessionalsTable();
      return res;
    }

    function toggleProfessionalSuspension(proId) {
      const res = TLAuth.toggleProfessionalAccountStatus(proId, "usr-admin-001");
      renderProfessionalsTable();
      return res;
    }

    function refreshAdminData() {
      renderProfessionalsTable();
    }

    // ------------------------------------------------------------------------
    // Test Assertions Runner
    // ------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', async () => {
      const results = [];

      function assert(name, condition, details = "") {
        results.push({ name, pass: Boolean(condition), details });
      }

      try {
        TLAuth.init();
        if (typeof TLServices !== "undefined") TLServices.init();
        if (typeof TLBookings !== "undefined") TLBookings.init();
        if (typeof TLCommunication !== "undefined") TLCommunication.init();

        // TEST 1: Joined Providers List Integrity
        const joined = TLAuth.getAllProfessionalsJoined();
        assert("getAllProfessionalsJoined() loads providers", joined.length >= 6, `Found ${joined.length} joined professionals`);

        const firstPro = joined[0];
        assert("Joined professional has linked user info", Boolean(firstPro.fullName && firstPro.email && firstPro.phone), `Name=${firstPro.fullName}, Email=${firstPro.email}`);
        assert("Security: passwordHash is not exposed", firstPro.passwordHash === undefined && firstPro.user.passwordHash === undefined, "Zero password hash exposure confirmed");
        assert("Professional has computed live rating", typeof firstPro.rating === 'number' && firstPro.rating > 0, `Rating=${firstPro.rating}`);

        // TEST 2: Initial Table Rendering & Stat Strip
        renderProfessionalsTable();
        const statTotal = parseInt(document.getElementById('proStatTotal').innerText, 10);
        const statVerif = parseInt(document.getElementById('proStatVerified').innerText, 10);
        const statPending = parseInt(document.getElementById('proStatPending').innerText, 10);
        const statPrem = parseInt(document.getElementById('proStatPremium').innerText, 10);
        const statSusp = parseInt(document.getElementById('proStatSuspended').innerText, 10);

        assert("Top Stat Total matches joined count", statTotal === joined.length, `Total=${statTotal}`);
        assert("Verified counter is valid", statVerif > 0, `Verified=${statVerif}`);
        assert("Pending KYC counter is valid", statPending >= 0, `Pending=${statPending}`);
        assert("Premium counter is valid", statPrem >= 0, `Premium=${statPrem}`);

        // TEST 3: Search Filtering
        onProSearchChange("Rashid");
        let renderedRows = document.querySelectorAll('#professionalsManagementTbody tr');
        assert("Search by provider name works", renderedRows.length >= 1, `Found ${renderedRows.length} rows matching 'Rashid'`);

        onProSearchChange("Solar");
        renderedRows = document.querySelectorAll('#professionalsManagementTbody tr');
        assert("Search by trade sector works", renderedRows.length >= 1, `Found ${renderedRows.length} rows matching 'Solar'`);

        onProSearchChange("NonExistentProviderQuery123");
        assert("Search non-existent shows empty state", document.getElementById('professionalsManagementTbody').innerText.includes("No service professionals found"), "Empty state rendered cleanly");

        resetProFilters();
        assert("Reset filters restores table", document.querySelectorAll('#professionalsManagementTbody tr').length === 5, "Restored 5 items per page");

        // TEST 4: Verification Filter
        document.getElementById('professionalVerifFilter').value = 'verified';
        onProVerifFilterChange();
        const verifRows = document.querySelectorAll('#professionalsManagementTbody tr');
        assert("Verification filter (verified) filters rows", verifRows.length > 0 && verifRows.length <= statVerif, `Verified count=${verifRows.length}`);

        resetProFilters();

        // TEST 5: Category Filter
        document.getElementById('professionalCategoryFilter').value = 'plumbing';
        onProCategoryFilterChange();
        const plumbRows = document.querySelectorAll('#professionalsManagementTbody tr');
        assert("Category filter (plumbing) works", plumbRows.length >= 1, `Plumbing count=${plumbRows.length}`);

        resetProFilters();

        // TEST 6: Professional Full Dossier Modal
        openProfessionalDossierModal("prov-profile-001");
        assert("Dossier modal is activated", document.getElementById('professionalDossierModal').classList.contains('active'), "Modal active class present");
        assert("Dossier displays business name", document.getElementById('dossierBusinessName').innerText.includes("PowerGuard") || document.getElementById('dossierBusinessName').innerText.length > 0, `Business=${document.getElementById('dossierBusinessName').innerText}`);
        assert("Dossier displays listed services count", parseInt(document.getElementById('dossierServicesCount').innerText, 10) >= 1, `Services count=${document.getElementById('dossierServicesCount').innerText}`);
        assert("Dossier displays portfolio showcases count", parseInt(document.getElementById('dossierPortfolioCount').innerText, 10) >= 1, `Portfolio count=${document.getElementById('dossierPortfolioCount').innerText}`);
        assert("Dossier displays received bookings count", parseInt(document.getElementById('dossierBookingsCount').innerText, 10) >= 1, `Bookings count=${document.getElementById('dossierBookingsCount').innerText}`);

        closeProfessionalDossierModal();
        assert("Dossier modal closes cleanly", !document.getElementById('professionalDossierModal').classList.contains('active'), "Modal active class removed");

        // TEST 7: Edit Professional Profile by Admin
        openEditProfessionalModal("prov-profile-001");
        assert("Edit modal opens", document.getElementById('professionalEditModal').classList.contains('active'), "Edit modal open");
        document.getElementById('modalProEditBusinessName').value = "PowerGuard High Voltage Ltd";
        document.getElementById('modalProEditCity').value = "Lahore";
        document.getElementById('modalProEditExperience').value = 14;
        const updateRes = handleProEditSubmit();
        assert("updateProfessionalByAdmin succeeds", updateRes.success === true, "Profile updated in database");

        const updatedPro = TLAuth.getAllProfessionalsJoined().find(p => p.id === "prov-profile-001");
        assert("Business name updated", updatedPro.businessName === "PowerGuard High Voltage Ltd", `New name=${updatedPro.businessName}`);
        assert("Experience updated", updatedPro.experienceYears === 14, `New exp=${updatedPro.experienceYears}`);
        assert("Operational city updated & synced", updatedPro.city === "Lahore", `City=${updatedPro.city}`);
        
        const linkedUser = TLAuth.getUsers().find(u => u.id === updatedPro.userId);
        assert("City synced to linked user account", linkedUser.city === "Lahore", `User City=${linkedUser.city}`);

        // TEST 8: KYC Review Decision Action
        openKYCReviewModal("prov-profile-001");
        assert("KYC modal opens", document.getElementById('professionalKYCModal').classList.contains('active'), "KYC modal active");
        document.getElementById('modalKYCDecision').value = 'verified';
        document.getElementById('modalKYCReasonNote').value = "Trade verification certificates approved by senior admin inspector.";
        const kycRes = handleKYCReviewSubmit();
        assert("KYC decision recorded", kycRes.success === true, "KYC verified recorded");

        const kycPro = TLAuth.getProviders().find(p => p.id === "prov-profile-001");
        assert("Verification status confirmed verified", kycPro.verificationStatus === 'verified', `Status=${kycPro.verificationStatus}`);

        // Verify audit trail logged
        const auditLogs = TLCommunication.getAdminAuditTrail();
        const latestAudit = auditLogs.find(l => l.targetId === "prov-profile-001");
        assert("Administrative audit trail recorded action", Boolean(latestAudit), `Logged audit: ${latestAudit?.details || 'Found'}`);

        // TEST 9: Account Suspension & Referential Integrity Guard
        const targetSusId = "prov-profile-002";
        const susRes = toggleProfessionalSuspension(targetSusId);
        assert("Suspension toggled successfully", susRes.success === true, "Account suspended");

        const susUser = TLAuth.getUsers().find(u => u.id === "usr-prov-002");
        assert("Linked user in tl_db_users is suspended", susUser.status === "suspended", `Status=${susUser.status}`);

        // Verify suspended pro cannot sign in (BR-08)
        const loginAttempt = await TLAuth.login(susUser.email, "ProviderPass2026!");
        assert("Suspended provider login blocked by RBAC", loginAttempt.success === false && loginAttempt.error.includes("suspended"), `Login error=${loginAttempt.error}`);

        // Reactivate account
        const reactivateRes = toggleProfessionalSuspension(targetSusId);
        assert("Reactivation toggle succeeds", reactivateRes.success === true, "Account reactivated");
        const activeUser = TLAuth.getUsers().find(u => u.id === "usr-prov-002");
        assert("Linked user status restored to active", activeUser.status === "active", `Status=${activeUser.status}`);

        // Verify active pro can now sign in
        const retryLogin = await TLAuth.login(activeUser.email, "ProviderPass2026!");
        assert("Reactivated provider can sign in", retryLogin.success === true, "Login successful after reactivation");

        // TEST 10: Pagination controls
        onProPerPageChange(2);
        assert("Pagination perPage 2 sets pages", document.getElementById('proPaginationControls').children.length >= 3, `Page buttons=${document.getElementById('proPaginationControls').children.length}`);
        changeProPage(2);
        assert("Page 2 info updated", document.getElementById('proPaginationInfo').innerText.includes("Showing 3 to 4"), `Label=${document.getElementById('proPaginationInfo').innerText}`);

      } catch (err) {
        assert("Unexpected runtime exception", false, err.message + "\n" + err.stack);
      }

      // Render Results Summary
      const passedCount = results.filter(r => r.pass).length;
      const totalCount = results.length;
      const allPassed = passedCount === totalCount;

      let html = `<div class="summary-bar ${allPassed ? 'summary-pass' : 'summary-fail'}">`;
      html += allPassed 
        ? `✅ ALL ${totalCount} ASSERTIONS PASSED (100% Comprehensive Coverage)` 
        : `❌ ${totalCount - passedCount} OF ${totalCount} ASSERTIONS FAILED`;
      html += `</div>`;

      results.forEach(r => {
        html += `
          <div class="test-box ${r.pass ? 'pass' : 'fail'}">
            <span class="badge ${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</span>
            <strong>${escapeHtml(r.name)}</strong>
            ${r.details ? `<div class="details">${escapeHtml(r.details)}</div>` : ''}
          </div>
        `;
      });

      document.getElementById('resultsUI').innerHTML = html;
    });
  </script>
</body>
</html>
